<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
    <style> /* style bir kere yazıp her seferinde yazmaktan kurtulduk */
        p{
            color: aqua;
            font-size: 8px;

        }
        h3{
            color: red;
            font-size: 22px;
        }
        div{
            color: yellow;
            font-size: 30px;
        }
        p1{
            color: green;
            font-size: larger;
        }
    </style>
</head>
<body>
    <h1> DENEME</h1>
    <h1 style="color: darkred; font-size: 50px;"> DENEME </h1>
    <h3 style="font-size: 20px; color: brown;" > burası bir başlıktır  </h3>

    <p > Genel anlamda disiplin kavramı bir amaçla bir araya gelmiş
         insan grubunun düzen içinde yaşamasını sağlamak için seçilip konulmul kuralları
        ifade eder.</p>
    
    <h3> h3 kullanımına örnektir </h3>
    <div> division (bölüm) kullanımına örenktir </div>
    <p1> paragraf kullanımına örnektir </p1>    

</body>
</html>
